version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# CD-Recruit — Local Development Docker Compose
#
# Services:
#   postgres   — primary database (unchanged from Phase 1)
#   redis      — BullMQ job queues + session cache
#   keycloak   — OIDC identity provider (dev mode, pre-imported realm)
#   minio      — S3-compatible object storage (evidence clips, artefacts)
#
# Start all services:
#   docker compose -f docker/docker-compose.dev.yml up -d
#
# Stop all services:
#   docker compose -f docker/docker-compose.dev.yml down
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Postgres ────────────────────────────────────────────────────────────────
  # DO NOT MODIFY — Phase 1 config; seeded data lives here.
  postgres:
    image: postgres:16-alpine
    container_name: cdrecruit_postgres_dev
    environment:
      POSTGRES_USER: cdrecruit
      POSTGRES_PASSWORD: cdrecruit123
      POSTGRES_DB: cdrecruit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdrecruit -d cdrecruit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  # Used by BullMQ (job queues) and session-state caching.
  redis:
    profiles: ["full"]
    image: redis:7-alpine
    container_name: cdrecruit_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak ────────────────────────────────────────────────────────────────
  # OIDC identity provider running in dev mode (no TLS, embedded H2 DB for Keycloak metadata).
  # The cd-recruit realm is pre-imported from docker/keycloak/realm-export.json.
  #
  # ⚠️  PLACEHOLDER DEFAULTS — verify before Phase 4 (Auth) goes live:
  #   - Realm:          cd-recruit
  #   - API client:     cd-recruit-api   (confidential, client-credentials flow)
  #   - Frontend client:cd-recruit-frontend (public, PKCE)
  #   - Redirect URIs:  http://localhost:3000/* (candidate-web)
  #                     http://localhost:3001/* (NestJS API — for admin-web callback)
  #   Admin console:    http://localhost:8080  (admin / admin)
  keycloak:
    profiles: ["full"]
    image: quay.io/keycloak/keycloak:24.0
    container_name: cdrecruit_keycloak_dev
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Point Keycloak to Postgres for its own metadata store (optional — uses embedded H2 by default in start-dev)
      # Uncomment below to persist Keycloak config across restarts:
      # KC_DB: postgres
      # KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      # KC_DB_USERNAME: cdrecruit
      # KC_DB_PASSWORD: cdrecruit123
    ports:
      - "8085:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fs http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── MinIO ───────────────────────────────────────────────────────────────────
  # S3-compatible object storage for evidence clips and general artefacts.
  # Console: http://localhost:9001  (minioadmin / minioadmin)
  # API:     http://localhost:9000
  minio:
    profiles: ["full"]
    image: minio/minio:latest
    container_name: cdrecruit_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
