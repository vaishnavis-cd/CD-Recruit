version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cdrecruit_postgres_dev
    environment:
      POSTGRES_USER: cdrecruit
      POSTGRES_PASSWORD: cdrecruit123
      POSTGRES_DB: cdrecruit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
