version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# CD-Recruit — Local Development Docker Compose
#
# Services:
#   postgres   — primary database (unchanged from Phase 1)
#   redis      — BullMQ job queues + session cache
#   minio      — S3-compatible object storage (evidence clips, artefacts)

  # ── MinIO ───────────────────────────────────────────────────────────────────
  # S3-compatible object storage for evidence clips and general artefacts.
  # Console: http://localhost:9001  (minioadmin / minioadmin)
  # API:     http://localhost:9000
  minio:
    image: minio/minio:latest
    container_name: cdrecruit_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: cdrecruit_mongodb_dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Face Verify Service (FastAPI + DeepFace) ────────────────────────────────
  face-verify-service:
    build:
      context: ../services/face-verify
    container_name: cdrecruit_face_verify_dev
    ports:
      - "8001:8000"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mongodb_data:
