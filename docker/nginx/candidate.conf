# ─────────────────────────────────────────────────────────────────────────────
# Nginx Configuration for Candidate Web SPA
# Features:
#   - Gzip Compression for modern web assets
#   - COOP & COEP Isolation Headers (enables MediaPipe webcam tracking & SQLite WASM)
#   - Proper application/wasm MIME type mapping
#   - SPA Fallback routing (try_files $uri $uri/ /index.html)
#   - 1-year immutable caching for static /assets/
#   - Container Liveness probe at /healthz
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Security & Cross-Origin Isolation Headers for WebAssembly and Camera Proctoring
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Standard MIME types
    include /etc/nginx/mime.types;
    default_type text/html;

    # Container health probe endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Static assets with long-lived immutable cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        try_files $uri =404;
    }

    # Reverse proxy for API calls
    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        try_files $uri $uri/ /index.html;
    }
}
