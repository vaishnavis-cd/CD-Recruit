worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/wasm;

    upstream nestjs_backend {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    upstream admin_frontend {
        server 127.0.0.1:3002;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost _;

        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;

        # ── API Reverse Proxy ──
        location /api/ {
            proxy_pass http://nestjs_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # ── WebSocket Real-Time Synchronizer ──
        location /socket.io/ {
            proxy_pass http://nestjs_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Admin Web App (/admin) ──
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://admin_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /admin;
        }

        # ── Static Assets (Candidate Web first, fallback to Admin Web) ──
        location /assets/ {
            root /usr/share/nginx/html/candidate;
            try_files $uri @admin_assets;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        location @admin_assets {
            proxy_pass http://admin_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Candidate Web SPA (Root /) ──
        location / {
            root /usr/share/nginx/html/candidate;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(wasm|tflite|bin)$ {
                add_header Content-Type application/wasm;
                add_header Cross-Origin-Resource-Policy "cross-origin" always;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, no-transform";
                add_header Cross-Origin-Embedder-Policy "credentialless" always;
                add_header Cross-Origin-Opener-Policy "same-origin" always;
            }
        }
    }
}
